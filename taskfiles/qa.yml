version: '3'

tasks:
  capcut-alpha:
    desc: Проверить RGB и альфу готового ProRes для CapCut
    requires:
      vars: [INPUT]
    cmds:
      - node scripts/check-capcut-alpha.mjs --input "{{.INPUT}}"

  frames:
    desc: Отрендерить ключевые кадры для визуальной приёмки
    requires:
      vars: [COMPOSITION]
    vars:
      FRAMES: '{{.FRAMES | default "0,30,60,90"}}'
    deps: [':generate']
    cmds:
      - node scripts/render-keyframes.mjs --composition "{{.COMPOSITION}}" --frames "{{.FRAMES}}"
