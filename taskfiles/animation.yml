version: '3'

tasks:
  new:
    desc: Создать пронумерованную анимацию внутри части видео
    requires:
      vars: [VIDEO, PART, ORDER, ANIMATION]
    vars:
      KIND: '{{.KIND | default "2d"}}'
    cmds:
      - node scripts/create-animation.mjs --video "{{.VIDEO}}" --part "{{.PART}}" --order "{{.ORDER}}" --animation "{{.ANIMATION}}" --title "{{.TITLE | default .ANIMATION}}" --kind "{{.KIND}}"
      - task: :generate
